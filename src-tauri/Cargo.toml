[package]
name = "legajo"
version = "0.1.0"
description = "Muestreo y analisis de archivos periodisticos en WordPress"
authors = ["Ivan Montes"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "legajo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
legajo-core = { path = "../core" }
# Solo para recorrer varias ventanas del censo a la vez.
tokio = { version = "1", features = ["rt", "macros"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
