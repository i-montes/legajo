[package]
name = "legajo"
version = "0.1.0"
description = "Muestreo y analisis de archivos periodisticos en WordPress"
authors = ["Ivan Montes"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "legajo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
legajo-core = { path = "../core" }
# Solo para recorrer varias ventanas del censo a la vez.
tokio = { version = "1", features = ["rt", "macros"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# La capa de actualizacion, solo en escritorio: en movil no hay updater y el
# plugin no compila. `process` es lo que permite reiniciar la app despues de
# instalar, que es el ultimo paso de toda actualizacion.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
