[package]
name = "legajo"
version = "0.1.0"
description = "Muestreo y analisis de archivos periodisticos en WordPress"
authors = ["Ivan Montes"]
edition = "2021"
rust-version = "1.77"
# Desde que existe `src/bin/servidor_debug.rs` el paquete tiene dos binarios;
# sin esto `cargo run` (y por tanto `tauri dev`, que lo invoca sin `--bin`)
# no sabe cuál lanzar y aborta con "could not determine which binary to run".
default-run = "legajo"

[lib]
name = "legajo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
legajo-core = { path = "../core" }
# `net` e `io-util` son para el servidor HTTP del modo servidor (axum, más
# abajo); el resto ya estaba por el recorrido de varias ventanas del censo a
# la vez.
#  "sync" es para difundir presencia y bloqueos por WebSocket a varias
# conexiones a la vez (canales entre la tarea de cada conexión y la que
# vigila caducidad); "time" es el intervalo con el que esa vigilancia
# comprueba latidos.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# El modo servidor: expone por HTTP los comandos de revisión y anotación para
# que otra instancia de Legajo, en otra máquina de la misma red, pueda
# corregir sin tocar este SQLite directamente. Se eligió por ser lo que menos
# fricción tiene con el tokio que ya estaba. "ws" suma el WebSocket de
# presencia y bloqueos por artículo (ver `servidor.rs`).
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }

# La capa de actualizacion, solo en escritorio: en movil no hay updater y el
# plugin no compila. `process` es lo que permite reiniciar la app despues de
# instalar, que es el ultimo paso de toda actualizacion.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
