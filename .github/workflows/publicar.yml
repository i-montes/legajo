# Construye el instalador de Legajo para las cuatro plataformas y lo deja en un
# release, junto al `latest.json` firmado que la app consulta para saber si hay
# versión nueva.
#
# Se dispara al etiquetar (`git tag v0.1.1 && git push --tags`). El release se
# crea como borrador a propósito: subir un instalador y encender la
# actualización para todo el mundo son dos decisiones distintas, y la segunda se
# toma a mano publicando el release desde GitHub. Hasta entonces, nadie recibe
# el aviso.
#
# Lo que se sube son unos pocos megas por plataforma: la app y nada más. El
# intérprete de Python y los modelos los instala cada máquina por su cuenta la
# primera vez —ver `core/src/entorno.rs`— y no se vuelven a bajar al actualizar.
name: Publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# El workflow crea el release y le sube archivos.
permissions:
  contents: write

jobs:
  # La etiqueta no es la que manda: el nombre del release y el numero que la app
  # compara para saber si hay version nueva salen de `tauri.conf.json`. Etiquetar
  # v0.1.1 sin subir ese numero produce un release llamado 0.1.0 que ninguna
  # instalacion reconoce como nuevo, y el fallo no se nota hasta que alguien
  # pregunta por que no le llego nada. Se comprueba aqui, en veinte segundos, y
  # antes de compilar cuatro plataformas.
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: La etiqueta y las cinco versiones dicen lo mismo
        run: |
          set -euo pipefail
          conf=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          pkg=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          raiz=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          core=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
          shell=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)

          echo "tauri.conf.json      $conf"
          echo "package.json         $pkg"
          echo "Cargo.toml           $raiz"
          echo "core/Cargo.toml      $core"
          echo "src-tauri/Cargo.toml $shell"

          for v in "$pkg" "$raiz" "$core" "$shell"; do
            if [ "$v" != "$conf" ]; then
              echo "::error::Las versiones del repositorio no coinciden entre si."
              exit 1
            fi
          done

          # En un dispatch manual no hay etiqueta que comparar: se prueba la
          # tuberia, no se publica una version.
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Sin etiqueta (dispatch manual): no hay nada mas que comparar."
            exit 0
          fi

          etiqueta="${{ github.ref_name }}"
          if [ "${etiqueta#v}" != "$conf" ]; then
            echo "::error::La etiqueta $etiqueta no corresponde a la version $conf."
            echo "Sube la version en los cinco archivos, o etiqueta v$conf."
            exit 1
          fi
          echo "La etiqueta $etiqueta y la version $conf coinciden."

  construir:
    needs: comprobar
    strategy:
      # Sin fail-fast: si falla Windows, interesa igual tener el .dmg y el
      # AppImage del resto en el borrador para poder probarlos.
      fail-fast: false
      # De uno en uno: los cuatro reescriben el mismo `latest.json` y es un
      # lee-modifica-escribe. Si dos coinciden, el archivo queda sin una
      # plataforma y esa deja de recibir actualizaciones sin que nada falle a la
      # vista. Un release es cosa de cada varias semanas.
      max-parallel: 1
      matrix:
        include:
          - plataforma: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            objetivo: aarch64-apple-darwin
          - plataforma: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            objetivo: x86_64-apple-darwin
          # 22.04 y no la última: el AppImage y el .deb quedan atados a la glibc
          # de la máquina que los construye, y una redacción no corre siempre la
          # distribución del año.
          - plataforma: ubuntu-22.04
            args: "--bundles appimage,deb"
            objetivo: x86_64-unknown-linux-gnu
          - plataforma: windows-latest
            args: "--bundles nsis"
            objetivo: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.plataforma }}

    steps:
      - uses: actions/checkout@v5

      - name: Dependencias de sistema (Linux)
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf build-essential file wget

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.objetivo }}

      # La caché de cargo es lo que separa un build de veinte minutos de uno de
      # tres. Se separa por plataforma y objetivo porque no se comparten nada.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          key: ${{ matrix.plataforma }}-${{ matrix.objetivo }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # La clave con la que se firma la actualización. Sin esto el build
          # sale igual, pero sin firma, y la app rechaza lo que no viene
          # firmado: la actualización quedaría anunciada y sin poder instalarse.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-prueba', github.run_number) }}
          releaseName: "Legajo __VERSION__"
          releaseBody: |
            Instaladores de Legajo __VERSION__.

            La primera vez, la app instala aparte el extractor —Python, torch,
            spaCy, GLiNER: 1,4 GB— desde el paso «Calibración». Las
            actualizaciones posteriores no vuelven a traerlo.

            En macOS el paquete no está firmado con un certificado de Apple: en
            el primer arranque hay que abrirlo con clic derecho › Abrir.
          releaseDraft: true
          prerelease: false
          # El `latest.json` que consulta la app. Cada plataforma añade el suyo
          # al mismo archivo del release.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
