# Construye el instalador de Legajo para las cuatro plataformas y lo deja en un
# release, junto al `latest.json` firmado que la app consulta para saber si hay
# versión nueva.
#
# Se dispara al etiquetar (`git tag v0.1.1 && git push --tags`). El release se
# crea como borrador a propósito: subir un instalador y encender la
# actualización para todo el mundo son dos decisiones distintas, y la segunda se
# toma a mano publicando el release desde GitHub. Hasta entonces, nadie recibe
# el aviso.
#
# Lo que se sube son unos pocos megas por plataforma: la app y nada más. El
# intérprete de Python y los modelos los instala cada máquina por su cuenta la
# primera vez —ver `core/src/entorno.rs`— y no se vuelven a bajar al actualizar.
name: Publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# El workflow crea el release y le sube archivos.
permissions:
  contents: write

jobs:
  construir:
    strategy:
      # Sin fail-fast: si falla Windows, interesa igual tener el .dmg y el
      # AppImage del resto en el borrador para poder probarlos.
      fail-fast: false
      matrix:
        include:
          - plataforma: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            objetivo: aarch64-apple-darwin
          - plataforma: macos-latest
            args: "--target x86_64-apple-darwin --bundles app,dmg"
            objetivo: x86_64-apple-darwin
          # 22.04 y no la última: el AppImage y el .deb quedan atados a la glibc
          # de la máquina que los construye, y una redacción no corre siempre la
          # distribución del año.
          - plataforma: ubuntu-22.04
            args: "--bundles appimage,deb"
            objetivo: ""
          - plataforma: windows-latest
            args: "--bundles nsis"
            objetivo: ""

    runs-on: ${{ matrix.plataforma }}

    steps:
      - uses: actions/checkout@v5

      - name: Dependencias de sistema (Linux)
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf build-essential file wget

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.objetivo }}

      # La caché de cargo es lo que separa un build de veinte minutos de uno de
      # tres. Se separa por plataforma y objetivo porque no se comparten nada.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          key: ${{ matrix.plataforma }}-${{ matrix.objetivo }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # La clave con la que se firma la actualización. Sin esto el build
          # sale igual, pero sin firma, y la app rechaza lo que no viene
          # firmado: la actualización quedaría anunciada y sin poder instalarse.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-prueba', github.run_number) }}
          releaseName: "Legajo __VERSION__"
          releaseBody: |
            Instaladores de Legajo __VERSION__.

            La primera vez, la app instala aparte el extractor —Python, torch,
            spaCy, GLiNER: 1,4 GB— desde el paso «Calibración». Las
            actualizaciones posteriores no vuelven a traerlo.

            En macOS el paquete no está firmado con un certificado de Apple: en
            el primer arranque hay que abrirlo con clic derecho › Abrir.
          releaseDraft: true
          prerelease: false
          # El `latest.json` que consulta la app. Cada plataforma añade el suyo
          # al mismo archivo del release.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
